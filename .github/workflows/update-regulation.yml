name: Update regulation

on:
  schedule:
    # Hourly effect: GitHub drops or delays many scheduled runs, so two attempts per hour (the shortest interval
    # is 5 minutes). Runs that find nothing new commit nothing.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-regulation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install dependencies
        run: pip install -r requirements-fetch.txt

      - name: Fetch balancing state and aggregated bids
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m pipeline regulation

      - name: Commit changes
        if: always()
        run: bash scripts/commit_data.sh "Update regulation"
