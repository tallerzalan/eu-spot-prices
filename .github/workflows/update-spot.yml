name: Update spot prices

on:
  schedule:
    # GitHub drops or delays many scheduled runs, so there are several attempts per hour (UTC 11-17). The gate
    # below only lets runs through between 13:00 and 18:30 Europe/Brussels (handles CET/CEST), and the fetch step
    # exits at once when tomorrow's prices are already complete, so extra attempts cost nothing.
    # ENTSO-E has most zones around 13:15 market time; the last ones arrive by about 18:00.
    - cron: "5,20,35,50 11-17 * * *"
  workflow_dispatch: # manual run from the Actions tab, skips the time gate

permissions:
  contents: write

concurrency:
  group: update-spot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check market-time window
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ=Europe/Brussels date +%-H)
          minute=$(TZ=Europe/Brussels date +%-M)
          echo "Brussels time: $hour:$minute"
          if [ "$hour" -ge 13 ] && { [ "$hour" -le 17 ] || { [ "$hour" -eq 18 ] && [ "$minute" -lt 30 ]; }; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-fetch.txt

      - name: Fetch spot prices
        if: steps.gate.outputs.run == 'true'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m pipeline spot --skip-if-up-to-date

      - name: Fetch ECB exchange rates
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true # imbalance prices in CZK/PLN/RON are converted to EUR with these
        run: python -m pipeline fx

      - name: Commit changes
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/commit_data.sh "Update spot prices"
