name: Update intraday auctions

on:
  schedule:
    # IDA1 results come out about 15:00 and IDA2 about 22:00 the day before, IDA3 about 10:00 on the delivery day
    # (Brussels). Two attempts per hour because GitHub drops many scheduled runs; no change = no commit.
    - cron: "27,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ida
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install dependencies
        run: pip install -r requirements-fetch.txt

      - name: Fetch intraday auction prices
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m pipeline ida

      - name: Commit changes
        if: always()
        run: bash scripts/commit_data.sh "Update intraday auctions"
