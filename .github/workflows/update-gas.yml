name: Update gas

on:
  schedule:
    # TTF has hourly bars, NBP one daily settlement. Two attempts per hour because GitHub drops many scheduled
    # runs; no change = no commit.
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install dependencies
        run: pip install -r requirements-fetch.txt

      - name: Fetch TTF and NBP prices
        run: python -m pipeline gas

      - name: Commit changes
        if: always()
        run: bash scripts/commit_data.sh "Update gas"
