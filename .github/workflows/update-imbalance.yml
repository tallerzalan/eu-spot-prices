name: Update imbalance

on:
  schedule:
    - cron: "12 * * * *" # hourly, imbalance prices and volumes are published around the clock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-imbalance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install dependencies
        run: pip install -r requirements-fetch.txt

      - name: Fetch imbalance prices and volumes
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m pipeline imbalance

      - name: Commit changes
        if: always()
        run: bash scripts/commit_data.sh "Update imbalance"
